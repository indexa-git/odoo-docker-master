name: Publish odoo:master image

# Builds and publishes the base image Odoo does not ship: the master (future
# 20.0) nightly, packaged the same way odoo/docker packages 17.0/18.0/19.0.
# Consumers then do FROM ghcr.io/indexa-git/odoo:master, exactly as they do
# FROM odoo:19.0 on the 19.0 line.
#
# Archive this repo once Odoo publishes a real odoo:20.0 image.

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - entrypoint.sh
      - odoo.conf
      - wait-for-psql.py
      - .github/workflows/build.yaml
  schedule:
    # Monday 06:00 UTC — pick up the week's master nightly
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      odoo_deb:
        description: 'Pin an exact nightly .deb (e.g. odoo_19.5a1.20260901_all.deb); empty resolves the current one'
        required: false
        default: ''
      odoo_sha:
        description: 'sha1 of that .deb, required when odoo_deb is set'
        required: false
        default: ''

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/odoo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute date tag
        id: tags
        run: echo "date_tag=master-$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            ODOO_DEB=${{ inputs.odoo_deb }}
            ODOO_SHA=${{ inputs.odoo_sha }}
          tags: |
            ${{ env.IMAGE }}:master
            ${{ env.IMAGE }}:${{ steps.tags.outputs.date_tag }}
          # Multi-arch: the package page reads its description from the
          # manifest index annotations, not from the Dockerfile LABEL.
          annotations: |
            index:org.opencontainers.image.description=Odoo master (future 20.0) nightly, built on the official odoo/docker 19.0 recipe
            index:org.opencontainers.image.source=https://github.com/indexa-git/odoo-docker-master
            index:org.opencontainers.image.licenses=LGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the Odoo build that landed in the image
        run: |
          echo "📦 ${{ env.IMAGE }}:master"
          echo "📦 ${{ env.IMAGE }}:${{ steps.tags.outputs.date_tag }}"
          docker run --rm --entrypoint /usr/bin/odoo \
            ${{ env.IMAGE }}:${{ steps.tags.outputs.date_tag }} --version
